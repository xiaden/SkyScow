# SkyScow - Quick Start
# Usage: docker compose up -d
# Web UI: http://localhost:4096 (published on loopback only)

services:
  skyscow:
    image: ghcr.io/xiaden/skyscow:latest
    container_name: skyscow
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    shm_size: 2g
    security_opt:
      - seccomp=./config/chromium-seccomp.json
    ports:
      # Loopback-only by default: the agent is not reachable from other hosts.
      # To expose it on the network, bind a wider interface AND set
      # OPENCODE_SERVER_PASSWORD (see README).
      - "127.0.0.1:4096:4096"
    volumes:
      - ./data/opencode:/home/opencode
      - ./local-cache/opencode:/home/opencode/.cache/opencode
      - ./workspace:/workspace
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # Optional: set GITHUB_TOKEN_FILE=./secrets/github_token in .env before startup when GitHub access is needed.
    secrets:
      - source: github_token
        target: github_token
        uid: "${PUID:-1000}"
        gid: "${PGID:-1000}"
        mode: 0440

secrets:
  github_token:
    file: ${GITHUB_TOKEN_FILE:-/dev/null}

