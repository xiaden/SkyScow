# SkyScow - Full Configuration Reference
# Copy this file to docker-compose.yaml and customize.
# All options documented. Uncomment what you need.

services:
  skyscow:
    image: ghcr.io/xiaden/skyscow:latest
    container_name: skyscow
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    shm_size: 2g

    # --- Chromium sandbox seccomp profile (required for sandboxed Chromium) ---
    security_opt:
      - seccomp=./config/chromium-seccomp.json

    ports:
      # Loopback-only by default. To reach the web UI from other hosts, change
      # this to "4096:4096" (or a specific host IP) AND set
      # OPENCODE_SERVER_PASSWORD below, so the agent is not left unauthenticated.
      - "127.0.0.1:4096:4096" # OpenCode web UI (local-only)

    volumes:
      # --- Persistent state (all OpenCode data under home dir) ---
      - ./data/opencode:/home/opencode # Config, sessions, plugins, all XDG paths

      # --- Cache path (keep this on local disk; if this folder lives on NAS/CIFS, replace with an absolute local path) ---
      - ./local-cache/opencode:/home/opencode/.cache/opencode

      # --- Workspace ---
      - ./workspace:/workspace # Your project files

    environment:
      # --- Container user ---
      - PUID=${PUID:-1000} # Match your host UID for file permissions
      - PGID=${PGID:-1000} # Match your host GID for file permissions
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      # - SLEEV_VERSION=1.6.16 # Override; startup fetches/verifies CLI + gateway

      # --- Git identity (used on first boot) ---
      # - GIT_USER_NAME=Your Name
      # - GIT_USER_EMAIL=you@example.com

      # --- AI provider API keys (add the ones you use) ---
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # - GROQ_API_KEY=${GROQ_API_KEY:-}
      # GitHub CLI uses the optional runtime secret mounted at
      # /run/secrets/github_token; do not put the token in .env.

      # --- AWS Bedrock (uncomment all 3 for Bedrock) ---
      # - AWS_ACCESS_KEY_ID=
      # - AWS_SECRET_ACCESS_KEY=
      # - AWS_REGION=us-east-1

      # --- Azure OpenAI (uncomment all 3 for Azure) ---
      # - AZURE_OPENAI_ENDPOINT=
      # - AZURE_OPENAI_API_KEY=
      # - AZURE_OPENAI_API_VERSION=

      # --- OpenCode behavior (overrides image defaults) ---
      # - OPENCODE_MODEL=claude-sonnet-4-6
      # - OPENCODE_PERMISSION=auto
      # - OPENCODE_DISABLE_LSP_DOWNLOAD=true
      # - OPENCODE_DISABLE_AUTOCOMPACT=true
      # - OPENCODE_ENABLE_EXA=true

      # --- Web UI Security (basic auth for opencode web) ---
      # Required whenever the port is published beyond loopback: an
      # unauthenticated opencode web is a code-executing agent surface.
      # - OPENCODE_SERVER_PASSWORD=your-password
      # - OPENCODE_SERVER_USERNAME=opencode

    # Optional: set GITHUB_TOKEN_FILE=./secrets/github_token in .env before startup when GitHub access is needed.
    secrets:
      - source: github_token
        target: github_token
        uid: "${PUID:-1000}"
        gid: "${PGID:-1000}"
        mode: 0440

secrets:
  github_token:
    file: ${GITHUB_TOKEN_FILE:-/dev/null}
